name: 🚀 Deploy Study Site to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Cancel in-progress runs when a new push comes in
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build MkDocs & Deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for git-revision-date-localized

      # ── 2. Python setup ──────────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # ── 3. Install dependencies ───────────────────────────────────
      - name: 📦 Install MkDocs & plugins
        run: pip install -r requirements-docs.txt

      # ── 4. Prepare docs/ directory ───────────────────────────────
      - name: 📁 Copy study content into docs/
        run: |
          # Ensure target directories exist
          mkdir -p docs/semesters docs/daily-log docs/progress docs/resources
          # Copy semesters
          mkdir -p docs/semesters
          if [ -d "semesters" ]; then cp -r semesters/* docs/semesters/; fi

          # Copy daily logs (preserve folder structure)
          if [ -d "daily-log/2026" ]; then cp -r daily-log/2026 docs/daily-log/; fi
          cp daily-log/TEMPLATE.md docs/daily-log/

          # Copy progress trackers
          cp -r progress/* docs/progress/

          # Copy resources
          cp -r resources/* docs/resources/

      # ── 5. Auto-generate daily log index ─────────────────────────
      - name: 📅 Generate daily log index page
        run: python3 scripts/generate-site-nav.py

      # ── 6. Build MkDocs site ─────────────────────────────────────
      - name: 🔨 Build MkDocs site
        run: mkdocs build --strict --verbose
        env:
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}

      # ── 7. Deploy to GitHub Pages ─────────────────────────────────
      - name: 🚀 Deploy to GitHub Pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --clean --verbose

      # ── 8. Deployment summary ─────────────────────────────────────
      - name: ✅ Deployment complete
        run: |
          echo "🎉 Study site deployed!"
          echo "🌐 URL: https://pradeepku123.github.io/my-mtech-journey/"
          echo "📅 Deployed at: $(date -u '+%Y-%m-%d %H:%M UTC')"
